{% extends "base.html" %}
{% import 'bootstrap/form.html' as wtf %}

{% block app_content %}
    <h1>Parks</h1>
    <div class="row">
        <div class="col-md-4">
            {{ wtf.render_form(form) }}
        </div>
    </div>
    <div class="row">
        <div class="col-md-12">
            <h2>Park List</h2>
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Abbreviation</th>
                    </tr>
                </thead>
                <tbody>
                    {% for park in parks %}
                        <tr>
                            <td>{{ park.id }}</td>
                            <td>{{ park.name }}</td>
                            <td>{{ park.abbreviation }}</td>
                        </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
{% endblock %}
